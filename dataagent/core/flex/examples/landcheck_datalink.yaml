# Landcheck Copilot DataLink 子 Agent：只查语义图谱，不查库、不画图
#
# 前置：当前仓 DataLink MCP（默认 http://127.0.0.1:8765/mcp，见 DATALINK_MCP_URL）已启动且已对 landcheck 建图

AGENT_CONFIG:
  name: "Landcheck DataLink"
  version: "1.0"
  description: "查询 DataLink 图谱：表/列概念、可 JOIN 路径、关系置信度；不执行 SQL"
  backend: "langgraph"
  type: "react"
  max_iter: 6
  debug: false

MODEL:
  chat_model:
    provider: "openai"
    model_type: "chat"
    params:
      model: "$env{OPENAI_MODEL}"
      temperature: 0.1
      base_url: "$env{OPENAI_BASE_URL}"
      api_key: "$env{OPENAI_API_KEY}"

SCENARIO:
  chat:
    instructions: |
      你是 Landcheck 的 DataLink 语义探路 Agent。只通过 MCP 工具查询数据地图，不要执行 SQL，不要画图，不要翻仓库。

      ## 必须
      - 使用 `datalink_explore`（或本 server 上其它已暴露的 datalink_* 工具）回答：表/列含义、可能的 JOIN、概念同义、关系置信度
      - 用中文总结图谱线索；不确定时明确写「图谱未覆盖」，不要编造外键
      - 不要猜测具体业务数字（数量/金额）；数字必须留给 NL2SQL

      ## 禁止
      - 禁止查 MySQL、禁止编写或执行 SQL
      - 禁止调用 sub_agent_tool
      - 禁止 glob / bash / grep / read_file 翻仓库

TOOLS:
  mcp_servers:
    - server_id: datalink
      transport_type: streamable_http
      config:
        url: "$env{DATALINK_MCP_URL}"
      description: DataLink retrieval (datalink_explore)

WORKSPACE:
  allow_path:
    - "$env{DATAAGENT_REPO_ROOT}/dataagent/core/flex/examples"

PRE_WORKFLOW: []
POST_WORKFLOW: []

GOVERNANCE:
  invisibility:
    - glob
    - bash
    - grep
    - read_file
    - write_file
    - edit_file
    - create_plan
    - update_plan
    - delete_plan
    - complete_current_todo
    - sub_agent_tool
    - submit_subagent
    - poll_subagent
    - collect_subagent
